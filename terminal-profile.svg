<svg
  width="100%"
  height="100%"
  viewBox="0 0 1000 500"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="500">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="50%" stop-color="#081321"/>
      <stop offset="100%" stop-color="#03060D"/>
    </linearGradient>

    <!-- Robot gradient -->
    <linearGradient id="robot" x1="100" y1="100" x2="250" y2="280">
      <stop offset="0%" stop-color="#12365A"/>
      <stop offset="100%" stop-color="#071321"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1929"/>
      <stop offset="100%" stop-color="#06101C"/>
    </linearGradient>

    <!-- Blue/Cyan gradient -->
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>

    <!-- Grid -->
    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M40 0H0V40"
        stroke="#12304A"
        stroke-width="0.7"
        opacity="0.45"
      />
    </pattern>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Pulse animation -->
    <style>
      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      .scan {
        animation: scan 4s linear infinite;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: .35;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes scan {
        0% {
          transform: translateY(-500px);
        }
        100% {
          transform: translateY(500px);
        }
      }
    </style>

  </defs>


